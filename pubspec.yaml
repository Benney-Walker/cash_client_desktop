name: cash_client_desktop
description: "Cash Client desktop app for credit union office staff (administrators and agents)."
# Private app, never published to pub.dev.
publish_to: 'none'

# On Windows, build-name sets the product and file version and build-number
# the build suffix. On macOS they map to CFBundleShortVersionString and
# CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Same version as the collector app. Holds the light/dark choice, which
  # isn't sensitive.
  shared_preferences: ^2.5.6
  # Reads the installed version for Settings > About. Flutter Community
  # "Plus" plugins; supports Windows and macOS.
  package_info_plus: ^10.2.0
  # Calls to the backend; same version as the collector app.
  http: ^1.6.0
  # Sets the content type of the ID image in the multipart upload. Already
  # a dependency of http; listed because the app imports it directly.
  http_parser: ^4.1.2
  # The system "Open" dialog for choosing a member's ID image. Flutter team
  # plugin; supports Windows and macOS.
  file_selector: ^1.0.3
  # Dragging an ID picture onto Register member. Kept on 0.8: 0.9 changes
  # the API and needs Flutter 3.47.7 or later.
  desktop_drop: ^0.8.4
  # Opens the backend's password reset page in the browser ("Forgot
  # password?" on the sign-in screen). Flutter team plugin.
  url_launcher: ^6.3.1
  # Printable A4 receipts after a counter transaction: pdf builds the page,
  # printing opens the system print dialog (Windows and macOS).
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Inter is bundled so the app looks the same on Windows and macOS instead
  # of falling back to Segoe UI or SF. These are static instances generated
  # from the Google Fonts release of Inter (optical size 14); its licence is
  # in assets/fonts/inter/OFL.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
