name: cash_client_desktop
description: "Cash Client desktop app for credit union office staff (administrators and agents)."
# Private app, never published to pub.dev.
publish_to: 'none'

# On Windows, build-name sets the product and file version and build-number
# the build suffix. On macOS they map to CFBundleShortVersionString and
# CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Same version as the collector app. Holds the light/dark choice, which
  # isn't sensitive.
  shared_preferences: ^2.5.6
  # Reads the installed version for Settings > About. Flutter Community
  # "Plus" plugins; supports Windows and macOS.
  package_info_plus: ^10.2.0
  # Calls to the backend; same version as the collector app.
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Inter is bundled so the app looks the same on Windows and macOS instead
  # of falling back to Segoe UI or SF. These are static instances generated
  # from the Google Fonts release of Inter (optical size 14); its licence is
  # in assets/fonts/inter/OFL.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
